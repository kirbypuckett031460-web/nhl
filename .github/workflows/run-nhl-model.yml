name: Run NHL Model

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional YYYY-MM-DD date override"
        required: false
        default: ""
      train_speed:
        description: "Training speed preset"
        required: false
        default: "balanced"
      train_target:
        description: "Training target mode"
        required: false
        default: "auto"
      post_to_discord:
        description: "Post run output to Discord webhook if configured"
        required: false
        default: "true"
  schedule:
    # Daily run at 14:00 UTC.
    - cron: "0 14 * * *"
    # Daily run targeting 4:00 PM ET across DST/standard transitions.
    # 20:00 UTC == 4:00 PM ET during daylight saving time (UTC-4).
    - cron: "0 20 * * *"
    # 21:00 UTC == 4:00 PM ET during standard time (UTC-5).
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: run-nhl-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NHL_SEASON_START: ${{ vars.NHL_SEASON_START }}

    steps:
      - name: Schedule gate for 4:00 PM ET slot
        id: schedule_gate
        shell: bash
        run: |
          should_run="true"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            cron_expr="${{ github.event.schedule }}"
            if [[ "$cron_expr" == "0 20 * * *" || "$cron_expr" == "0 21 * * *" ]]; then
              et_hour="$(TZ=America/New_York date +%H)"
              if [[ "$et_hour" != "16" ]]; then
                echo "Skipping $cron_expr because current ET hour is $et_hour (not 16)."
                should_run="false"
              fi
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Slate lock gate
        id: slate_lock_gate
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY' > /tmp/slate_lock_gate.out
          import json
          from datetime import datetime, timezone
          from urllib.request import Request, urlopen
          from zoneinfo import ZoneInfo

          et_zone = ZoneInfo("America/New_York")
          now_utc = datetime.now(timezone.utc)
          now_et = datetime.now(et_zone)
          run_date_raw = "${{ github.event.inputs.run_date }}".strip()
          if run_date_raw:
              try:
                  target_date = datetime.strptime(run_date_raw, "%Y-%m-%d").date()
              except Exception:
                  target_date = now_et.date()
          else:
              target_date = now_et.date()

          target_date_iso = target_date.isoformat()
          lock_open = "true"
          reason = "slate_open"
          lock_time_utc = ""

          if target_date < now_et.date():
              lock_open = "false"
              reason = "past_slate_locked"
          elif target_date == now_et.date():
              urls = [
                  f"https://api-web.nhle.com/v1/schedule/{target_date_iso}",
                  f"https://api-web.nhle.com/v1/scoreboard/{target_date_iso}",
              ]

              def parse_ts(raw: str):
                  if not raw:
                      return None
                  try:
                      dt = datetime.fromisoformat(raw.replace("Z", "+00:00"))
                  except Exception:
                      return None
                  if dt.tzinfo is None:
                      dt = dt.replace(tzinfo=timezone.utc)
                  else:
                      dt = dt.astimezone(timezone.utc)
                  return dt

              starts = []
              for url in urls:
                  try:
                      req = Request(
                          url,
                          method="GET",
                          headers={
                              "Accept": "application/json",
                              "User-Agent": "nhl-github-action/1.0",
                          },
                      )
                      with urlopen(req, timeout=15) as resp:
                          payload = json.loads(resp.read().decode("utf-8", errors="ignore"))
                  except Exception:
                      continue

                  games = []
                  if isinstance(payload, dict):
                      direct_games = payload.get("games")
                      if isinstance(direct_games, list):
                          games.extend([g for g in direct_games if isinstance(g, dict)])
                      game_week = payload.get("gameWeek")
                      if isinstance(game_week, list):
                          selected = []
                          for day in game_week:
                              if not isinstance(day, dict):
                                  continue
                              if str(day.get("date") or "").strip() != target_date_iso:
                                  continue
                              day_games = day.get("games")
                              if isinstance(day_games, list):
                                  selected = [g for g in day_games if isinstance(g, dict)]
                                  break
                          if selected:
                              games.extend(selected)
                  if not games:
                      continue
                  for game in games:
                      ts = parse_ts(str(game.get("startTimeUTC") or game.get("gameDate") or game.get("startTime") or ""))
                      if ts is not None:
                          starts.append(ts)
                  if starts:
                      break

              if starts:
                  first_start = min(starts)
                  lock_time_utc = first_start.isoformat()
                  if now_utc >= first_start:
                      lock_open = "false"
                      reason = "today_slate_locked"
                  else:
                      reason = "today_slate_open"
              else:
                  reason = "lock_time_unavailable"

          print(f"lock_open={lock_open}")
          print(f"reason={reason}")
          print(f"target_date={target_date_iso}")
          print(f"lock_time_utc={lock_time_utc}")
          PY
          cat /tmp/slate_lock_gate.out
          cat /tmp/slate_lock_gate.out >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model/cache artifacts
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history/historical_games.csv
          key: nhl-model-cache-v1

      - name: Run NHL prediction pipeline
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/cache data/history

          TRAIN_SPEED_ARG="${{ github.event.inputs.train_speed }}"
          TRAIN_TARGET_ARG="${{ github.event.inputs.train_target }}"
          if [[ -z "${TRAIN_SPEED_ARG}" ]]; then TRAIN_SPEED_ARG="balanced"; fi
          if [[ -z "${TRAIN_TARGET_ARG}" ]]; then TRAIN_TARGET_ARG="auto"; fi
          if [[ -z "${NHL_SEASON_START:-}" ]]; then NHL_SEASON_START="2025-10-07"; fi

          DATE_ARG=()
          if [[ -n "${{ github.event.inputs.run_date }}" ]]; then
            DATE_ARG=(--date "${{ github.event.inputs.run_date }}")
          fi

          CMD=(
            python -u nhl_model3.py
            --no-open-browser
            --log-bets
            --log-path bets_log.csv
            --save-trained-model
            --use-saved-model
            --model-path data/cache/trained_model.joblib
            --historical-cache-path data/history/historical_games.csv
            --train-speed "${TRAIN_SPEED_ARG}"
            --train-target "${TRAIN_TARGET_ARG}"
          )
          CMD+=("${DATE_ARG[@]}")

          if [[ -n "${ODDS_API_KEY:-}" ]]; then
            echo "Using realtime odds API (ODDS_API_KEY present)."
            CMD+=(--realtime-odds --log-odds-history --odds-history-path odds_history.csv)
          else
            echo "::warning::ODDS_API_KEY is not configured. Realtime odds disabled; using local odds.json fallback."
            CMD+=(--odds-path odds.json)
          fi

          POST_TO_DISCORD_INPUT="${{ github.event.inputs.post_to_discord }}"
          if [[ -z "${POST_TO_DISCORD_INPUT}" ]]; then
            POST_TO_DISCORD_INPUT="true"
          fi
          if [[ "${POST_TO_DISCORD_INPUT,,}" == "true" ]]; then
            if [[ -n "${DISCORD_WEBHOOK_URL:-}" ]]; then
              CMD+=(--post-social --post-inline --post-inline-top 0)
            else
              echo "::warning::Discord posting requested but DISCORD_WEBHOOK_URL is not configured. Skipping Discord post."
            fi
          else
            echo "Discord posting disabled via workflow input."
          fi

          echo "Running command:"
          printf ' %q' "${CMD[@]}"
          echo
          "${CMD[@]}"

      - name: Publish updated outputs
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_INPUT="${{ github.event.inputs.publish_outputs }}"
          if [[ -z "${PUBLISH_INPUT}" ]]; then
            PUBLISH_INPUT="true"
          fi
          if [[ "${PUBLISH_INPUT,,}" != "true" ]]; then
            echo "Publish disabled via workflow input."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILES=(
            "bets_log.csv"
            "odds_history.csv"
            "data/cache/trained_model.joblib"
            "data/history/historical_games.csv"
          )
          if [[ -n "${ODDS_API_KEY:-}" ]]; then
            FILES+=(
              "predictions.png"
              "nhl_real_data_dashboard.html"
              "public_predictions.json"
            )
          else
            echo "ODDS_API_KEY missing: skipping public artifact publish files to avoid overwriting market/edge data with fallback odds."
          fi
          for file in "${FILES[@]}"; do
            if [[ -f "${file}" ]]; then
              git add "${file}"
            fi
          done

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore(ci): refresh NHL model outputs [skip ci]"

          branch_name="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch_name}"; then
              echo "Published outputs to ${branch_name}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing branch state and retrying..."
            git fetch origin "${branch_name}"
            if ! git pull --rebase origin "${branch_name}"; then
              echo "Rebase failed while retrying publish."
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done

          echo "Failed to publish outputs after retries."
          exit 1

      - name: Skip notice
        if: steps.schedule_gate.outputs.should_run != 'true'
        run: echo "Skipping this scheduled run because it is not the active 4:00 PM ET slot."

      - name: Slate lock skip notice
        if: steps.schedule_gate.outputs.should_run == 'true' && steps.slate_lock_gate.outputs.lock_open != 'true'
        run: |
          echo "Skipping run because slate is locked for date ${{ steps.slate_lock_gate.outputs.target_date }}."
          echo "Reason: ${{ steps.slate_lock_gate.outputs.reason }}"
          if [[ -n "${{ steps.slate_lock_gate.outputs.lock_time_utc }}" ]]; then
            echo "Lock time (UTC): ${{ steps.slate_lock_gate.outputs.lock_time_utc }}"
          fi
