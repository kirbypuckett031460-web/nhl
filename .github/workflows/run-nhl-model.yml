name: Run NHL Model

on:
  workflow_dispatch:
    inputs:
      run_date:
        description: "Optional YYYY-MM-DD date override"
        required: false
        default: ""
      train_speed:
        description: "Training speed preset"
        required: false
        default: "balanced"
      train_target:
        description: "Training target mode"
        required: false
        default: "auto"
      publish_outputs:
        description: "Commit/push generated artifacts back to the repo"
        required: false
        default: "true"
      post_to_discord:
        description: "Post results to Discord webhook if configured"
        required: false
        default: "true"
  schedule:
    # Daily run at 14:00 UTC.
    - cron: "0 14 * * *"
    # Daily run targeting 4:00 PM ET across DST/standard transitions.
    # 20:00 UTC == 4:00 PM ET during daylight saving time (UTC-4).
    - cron: "0 20 * * *"
    # 21:00 UTC == 4:00 PM ET during standard time (UTC-5).
    - cron: "0 21 * * *"

permissions:
  contents: write

concurrency:
  group: run-nhl-model-${{ github.ref }}
  cancel-in-progress: false

jobs:
  run-model:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
      DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
      NHL_SEASON_START: ${{ vars.NHL_SEASON_START }}

    steps:
      - name: Schedule gate for 4:00 PM ET slot
        id: schedule_gate
        shell: bash
        run: |
          should_run="true"
          if [[ "${{ github.event_name }}" == "schedule" ]]; then
            cron_expr="${{ github.event.schedule }}"
            if [[ "$cron_expr" == "0 20 * * *" || "$cron_expr" == "0 21 * * *" ]]; then
              et_hour="$(TZ=America/New_York date +%H)"
              if [[ "$et_hour" != "16" ]]; then
                echo "Skipping $cron_expr because current ET hour is $et_hour (not 16)."
                should_run="false"
              fi
            fi
          fi
          echo "should_run=$should_run" >> "$GITHUB_OUTPUT"

      - name: Checkout
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Python
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install dependencies
        if: steps.schedule_gate.outputs.should_run == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Restore model/cache artifacts
        if: steps.schedule_gate.outputs.should_run == 'true'
        uses: actions/cache@v4
        with:
          path: |
            data/cache
            data/history/historical_games.csv
          key: nhl-model-cache-v1

      - name: Run NHL prediction pipeline
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p data/cache data/history

          TRAIN_SPEED_ARG="${{ github.event.inputs.train_speed }}"
          TRAIN_TARGET_ARG="${{ github.event.inputs.train_target }}"
          if [[ -z "${TRAIN_SPEED_ARG}" ]]; then TRAIN_SPEED_ARG="balanced"; fi
          if [[ -z "${TRAIN_TARGET_ARG}" ]]; then TRAIN_TARGET_ARG="auto"; fi
          if [[ -z "${NHL_SEASON_START:-}" ]]; then NHL_SEASON_START="2025-10-07"; fi

          DATE_ARG=()
          if [[ -n "${{ github.event.inputs.run_date }}" ]]; then
            DATE_ARG=(--date "${{ github.event.inputs.run_date }}")
          fi

          CMD=(
            python -u nhl_model3.py
            --no-open-browser
            --log-bets
            --log-path bets_log.csv
            --save-trained-model
            --use-saved-model
            --model-path data/cache/trained_model.joblib
            --historical-cache-path data/history/historical_games.csv
            --train-speed "${TRAIN_SPEED_ARG}"
            --train-target "${TRAIN_TARGET_ARG}"
          )
          CMD+=("${DATE_ARG[@]}")

          if [[ -n "${ODDS_API_KEY:-}" ]]; then
            CMD+=(--realtime-odds --log-odds-history --odds-history-path odds_history.csv)
          else
            CMD+=(--odds-path odds.json)
          fi

          POST_TO_DISCORD_INPUT="${{ github.event.inputs.post_to_discord }}"
          if [[ -z "${POST_TO_DISCORD_INPUT}" ]]; then
            POST_TO_DISCORD_INPUT="true"
          fi
          if [[ "${POST_TO_DISCORD_INPUT,,}" == "true" ]]; then
            if [[ -n "${DISCORD_WEBHOOK_URL:-}" ]]; then
              CMD+=(--post-social --post-inline --post-inline-top 0)
            else
              echo "Discord posting requested but DISCORD_WEBHOOK_URL secret is not configured; skipping Discord post."
            fi
          else
            echo "Discord posting disabled via workflow input."
          fi

          echo "Running command:"
          printf ' %q' "${CMD[@]}"
          echo
          "${CMD[@]}"

      - name: Publish updated outputs
        if: steps.schedule_gate.outputs.should_run == 'true'
        shell: bash
        run: |
          set -euo pipefail

          PUBLISH_INPUT="${{ github.event.inputs.publish_outputs }}"
          if [[ -z "${PUBLISH_INPUT}" ]]; then
            PUBLISH_INPUT="true"
          fi
          if [[ "${PUBLISH_INPUT,,}" != "true" ]]; then
            echo "Publish disabled via workflow input."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          FILES=(
            "predictions.png"
            "nhl_real_data_dashboard.html"
            "public_predictions.json"
            "bets_log.csv"
            "odds_history.csv"
            "data/cache/trained_model.joblib"
            "data/history/historical_games.csv"
          )
          for file in "${FILES[@]}"; do
            if [[ -f "${file}" ]]; then
              git add "${file}"
            fi
          done

          if git diff --cached --quiet; then
            echo "No output changes to commit."
            exit 0
          fi

          git commit -m "chore(ci): refresh NHL model outputs [skip ci]"

          branch_name="${GITHUB_REF_NAME:-main}"
          for attempt in 1 2 3 4; do
            if git push origin "HEAD:${branch_name}"; then
              echo "Published outputs to ${branch_name}."
              exit 0
            fi
            echo "Push attempt ${attempt} failed; refreshing branch state and retrying..."
            git fetch origin "${branch_name}"
            if ! git pull --rebase origin "${branch_name}"; then
              echo "Rebase failed while retrying publish."
              git rebase --abort || true
              exit 1
            fi
            sleep $((attempt * 3))
          done

          echo "Failed to publish outputs after retries."
          exit 1

      - name: Skip notice
        if: steps.schedule_gate.outputs.should_run != 'true'
        run: echo "Skipping this scheduled run because it is not the active 4:00 PM ET slot."
